name: Doomsday IMAX booking check
# Trigger a fresh validation run after the YAML fix.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      send_test_notification:
        description: "Send a Telegram test message before checking bookings"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: doomsday-imax-check
  cancel-in-progress: false

jobs:
  check-bookings:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Restore tracker state
        uses: actions/cache/restore@v4
        with:
          path: tracker_state.json
          key: doomsday-tracker-state-${{ github.run_id }}
          restore-keys: |
            doomsday-tracker-state-

      - name: Send Telegram test notification
        if: github.event_name == 'workflow_dispatch' && inputs.send_test_notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram.py --test

      - name: Run IMAX-only booking check
        env:
          BOOKING_URL: ${{ secrets.BOOKING_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_DATE: ${{ vars.TARGET_DATE || '2026-12-17' }}
          THEATRE_KEYWORDS: ${{ vars.THEATRE_KEYWORDS || 'Nexus Vijaya Mall,PVR Palazzo' }}
          MOVIE_KEYWORDS: "${{ vars.MOVIE_KEYWORDS || 'Avengers: Doomsday,Avengers Doomsday' }}"
        run: python tracker.py

      - name: Save tracker state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: tracker_state.json
          key: doomsday-tracker-state-${{ github.run_id }}
