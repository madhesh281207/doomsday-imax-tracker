name: Doomsday IMAX booking check
# Trigger a fresh validation run after the YAML fix.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      send_test_notification:
        description: "Send a Telegram test message before checking bookings"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: doomsday-imax-check
  cancel-in-progress: false

jobs:
  check-bookings:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Restore tracker state
        uses: actions/cache/restore@v4
        with:
          path: tracker_state.json
          key: doomsday-tracker-state-${{ github.run_id }}
          restore-keys: |
            doomsday-tracker-state-

      - name: Send Telegram test notification
        if: (github.event_name == 'workflow_dispatch' && inputs.send_test_notification) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[telegram-test]'))
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram.py --test

      - name: Live detection test on a currently listed IMAX show
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[live-detection-test]')
        env:
          BOOKING_URL: https://in.bookmyshow.com/cinemas/chennai/pvr-palazzo-the-nexus-vijaya-mall/buytickets/PVPZ/20261102
          TARGET_DATE: '2026-11-02'
          THEATRE_KEYWORDS: 'Nexus Vijaya Mall,PVR Palazzo'
          MOVIE_KEYWORDS: 'Jailer 2'
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from tracker import inspect_page
          import os
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              detected, diagnostics = inspect_page(page, os.environ['BOOKING_URL'])
              browser.close()
          print(diagnostics)
          print(f'LIVE TEST RESULT: {"PASS - matching live IMAX show detected" if detected else "FAIL - live show not detected by current selectors"}')
          if not detected:
              raise SystemExit(1)
          PY

      - name: Run IMAX-only booking check
        env:
          BOOKING_URL: ${{ secrets.BOOKING_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_DATE: ${{ vars.TARGET_DATE || '2026-12-17' }}
          THEATRE_KEYWORDS: ${{ vars.THEATRE_KEYWORDS || 'Nexus Vijaya Mall,PVR Palazzo' }}
          MOVIE_KEYWORDS: "${{ vars.MOVIE_KEYWORDS || 'Avengers: Doomsday,Avengers Doomsday' }}"
        run: python tracker.py

      - name: Save tracker state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: tracker_state.json
          key: doomsday-tracker-state-${{ github.run_id }}
